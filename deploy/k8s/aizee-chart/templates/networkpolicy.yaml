apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aizee.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aizee.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Restrict ingress to same-namespace pods only (no cross-namespace allow-all).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aizee
      ports:
        - port: {{ .Values.dashboard.port }}
          protocol: TCP
  egress:
    # DNS resolution (kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
    # HTTPS egress to any destination (API calls, LLM providers, etc.).
    - ports:
        - port: 443
          protocol: TCP
