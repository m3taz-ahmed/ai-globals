# This chart does NOT render a real Secret with a token value.
#
# You MUST create the dashboard token Secret BEFORE installing/upgrading the
# chart, because the Deployment references it via secretKeyRef:
#
#   kubectl create secret generic aizee-dashboard-token \
#     --from-literal=token=$(python -c "import secrets; print(secrets.token_urlsafe(32))") \
#     -n aizee
#
# Or use sealed-secrets / external-secrets for GitOps workflows.
# The secret name/key are configurable via values:
#   existingSecretName: aizee-dashboard-token
#   existingSecretKey: token
