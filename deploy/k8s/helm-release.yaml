# NOTE: This is no longer a Flux HelmRelease.
# The aiZee dashboard is now deployed via a real, self-contained Helm chart
# located at ./deploy/k8s/aizee-chart (contains Chart.yaml + templates/).
#
# Install / upgrade with:
#   helm upgrade --install aizee ./deploy/k8s/aizee-chart -n aizee --create-namespace
#
# Before installing, create the dashboard token Secret (referenced by the chart
# via existingSecretName):
#   kubectl create secret generic aizee-dashboard-token \
#     --from-literal=token=$(python -c "import secrets; print(secrets.token_urlsafe(32))") \
#     -n aizee
