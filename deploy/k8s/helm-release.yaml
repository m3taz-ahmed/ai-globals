apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aizee
  namespace: aizee
spec:
  interval: 5m
  chart:
    spec:
      chart: ./deploy/k8s
      sourceRef:
        kind: GitRepository
        name: aizee
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/m3taz-ahmed/aizee
      tag: latest
      pullPolicy: IfNotPresent
    dashboard:
      port: 8080
      tokenSecret: aizee-dashboard-token
    persistence:
      state:
        size: 100Mi
      memory:
        size: 500Mi
      brain:
        size: 200Mi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
