name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy runtime memory aizee_mcp cli.py config.py dashboard/server.py
      - name: Test with coverage
        run: python -m pytest -q --cov-fail-under=80
      - name: Validate globals
        run: python scripts/validate-globals.py
      - name: Docs guard — API.md exists
        run: |
          if [ ! -f aizee_mcp/API.md ]; then
            echo "::error::aizee_mcp/API.md is missing"
            exit 1
          fi
      - name: Docs guard — LICENSE exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::LICENSE is missing"
            exit 1
          fi
      - name: Docs guard — CODEOWNERS exists
        run: |
          if [ ! -f .github/CODEOWNERS ]; then
            echo "::error::.github/CODEOWNERS is missing"
            exit 1
          fi
