name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run quality gates
        run: |
          ruff check .
          mypy runtime memory aios_mcp
          pytest -q --cov-fail-under=80
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version $VERSION"

  build-pypi:
    name: Build PyPI Package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Publish to PyPI (OIDC keyless)
        uses: pypa/gh-action-pypi-publish@v1
        with:
          attestations: true
          skip-existing: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-packages
          path: dist/

  build-docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  generate-sbom:
    name: Generate & Sign SBOM
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign SBOM
        run: |
          cosign sign-blob --yes sbom.spdx.json \
            --output-certificate sbom.pem \
            --output-signature sbom.sig
      - name: Attach SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.spdx.json
            sbom.pem
            sbom.sig

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-pypi, build-docker, generate-sbom]
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
