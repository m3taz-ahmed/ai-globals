[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "5.0.0"
description = "AI Global OS — sovereign AI engineering control plane"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Moataz Ahmed"}
]
keywords = ["ai", "agents", "mcp", "workflow", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "mcp>=1.0,<2.0",
    "turbovec>=0.1,<0.8",
    "numpy>=1.24,<3.0",
    "pydantic>=2.0,<3.0",
    "rich>=13.0,<14.0",
    "cryptography>=42.0,<46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<7.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-timeout>=2.0,<3.0",
    "pytest-xdist>=3.0,<4.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.0,<2.0",
    "types-pyyaml",
    "types-psutil",
    "graphifyy>=0.9.39,<0.9.40",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.0,<3.0",
]
graphify = [
    "graphifyy>=0.9.39,<0.9.40",
]
vector = [
    "sentence-transformers>=2.0,<3.0",
]

[project.scripts]
ai-os = "aios_cli:main"

[tool.setuptools]
py-modules = ["aios_cli", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "memory*", "aios_mcp*", "plugins*", "eval*"]
exclude = ["runtime.tests*", "memory.tests*", "tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "tmp",
    "scratch",
    "brain",
    "state",
    "temp",
    "__pycache__",
    ".git",
    ".github",
    "scripts/ui-ux-pro-max",
    "skills/gsap-animated-frontend",
    "tmp/**",
    "scratch/**",
    "temp/**",
    "tests/*",
    "tests/*/*",
    "skills/*",
    "skills/*/*",
    "skills/*/*/*",
]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests/", "skills/", "runtime/tests/", "memory/tests/", "dashboard/", "scripts/", "tmp/", "scratch/", "temp/", "brain/", "state/", "__pycache__/", "\\.git/", "\\.github/"]
[[tool.mypy.overrides]]
module = ["yaml", "sentence_transformers", "turbovec", "numpy", "psutil", "sentry_sdk"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["runtime/tests", "memory/tests", "tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-ra -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
    "unit: marks tests as fast unit tests",
    "fast: marks tests as fast (< 1s, no model loading, no server startup)",
    "mcp: marks tests that spin up the MCP server (slow, ~3s each)",
    "dashboard: marks tests that start the dashboard server (slow)",
    "vector: marks tests that load the SentenceTransformer model (slow)",
]
