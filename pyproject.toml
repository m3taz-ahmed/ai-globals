[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aizee"
version = "5.5.0"
description = "aiZee — sovereign AI engineering control plane"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Moataz Ahmed"}
]
keywords = ["ai", "agents", "mcp", "workflow", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "mcp>=1.0,<2.0",
    "turbovec>=0.1,<0.9",
    "numpy>=1.24,<3.0",
    "pydantic>=2.0,<3.0",
    "rich>=13.0,<14.0",
    "cryptography>=42.0,<52.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<7.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-timeout>=2.0,<3.0",
    "pytest-xdist>=3.0,<4.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.0,<2.0",
    "types-pyyaml",
    "types-psutil",
    "graphifyy>=0.9.16,<0.9.17",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.0,<3.0",
]
graphify = [
    "graphifyy>=0.9.16,<0.9.17",
]
vector = [
    "sentence-transformers>=2.0,<6.0",
]

[project.scripts]
aizee = "aizee_cli:main"

[tool.setuptools]
py-modules = ["aizee_cli", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "memory*", "aizee_mcp*", "plugins*", "eval*"]
exclude = ["runtime.tests*", "memory.tests*", "tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    "tmp",
    "scratch",
    "brain",
    "state",
    "temp",
    "__pycache__",
    ".git",
    ".github",
    "scripts/ui-ux-pro-max",
    "skills/gsap-animated-frontend",
    "tmp/**",
    "scratch/**",
    "temp/**",
]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"
]
ignore = ["E501", "UP042", "UP046", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["SIM117", "E701", "RUF043", "B017", "SIM102"]
"runtime/tests/**/*.py" = ["SIM117", "E701", "RUF043", "B017", "SIM102"]
"memory/tests/**/*.py" = ["SIM117", "E701", "RUF043", "B017", "SIM102"]
"eval/tests/**/*.py" = ["SIM117", "E701", "RUF043", "B017", "SIM102"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
exclude = [
    "skills/", "tmp/", "scratch/", "temp/", "brain/", "state/",
    "__pycache__/", "\\.git/", "\\.github/",
    # Old helper scripts that predate strict typing
    "scripts/tests/test_validator\\.py",
    "scripts/ui-ux-pro-max/",
    "scripts/graphify_mcp_wrapper\\.py",
    "scripts/validate-globals\\.py",
    "scripts/fetch-free-keys\\.py",
    "scripts/restore_brain\\.py",
]
[[tool.mypy.overrides]]
module = ["yaml", "sentence_transformers", "turbovec", "numpy", "psutil", "sentry_sdk"]
ignore_missing_imports = true

# Test files: included in type checking but with relaxed strictness.
# Tests use mocks, fixtures, and dynamic attributes that don't fit strict typing.
[[tool.mypy.overrides]]
module = ["tests.*", "runtime.tests.*", "memory.tests.*", "eval.tests.*"]
strict = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
check_untyped_defs = false
allow_untyped_defs = true
allow_incomplete_defs = true
disable_error_code = ["union-attr", "attr-defined", "method-assign", "comparison-overlap", "type-arg", "assignment", "misc"]

# Dashboard: stdlib HTTP server uses dynamic BaseHTTPRequestHandler attributes.
[[tool.mypy.overrides]]
module = ["dashboard.*"]
strict = false
disallow_untyped_defs = false
warn_return_any = false

# Scripts (general): relaxed for installer/wrapper scripts.
[[tool.mypy.overrides]]
module = ["scripts.*"]
strict = false
disallow_untyped_defs = false
warn_return_any = false

# MCP tools: FastMCP's @mcp.tool() decorator is untyped in the SDK.
# These modules register tools via that decorator, so we relax the
# untyped-decorator check for them only.
[[tool.mypy.overrides]]
module = [
    "aizee_mcp.tools.workflow_tools",
    "aizee_mcp.tools.policy_tools",
    "aizee_mcp.tools.memory_tools",
    "aizee_mcp.tools.context_tools",
    "aizee_mcp.tools.seo_tools",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["scripts.generate_manifest", "scripts.guard_invariants"]
strict = false
disallow_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["runtime/tests", "memory/tests", "eval/tests", "tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
    "unit: marks tests as fast unit tests",
    "fast: marks tests as fast (< 1s, no model loading, no server startup)",
    "mcp: marks tests that spin up the MCP server (slow, ~3s each)",
    "dashboard: marks tests that start the dashboard server (slow)",
    "vector: marks tests that load the SentenceTransformer model (slow)",
]
